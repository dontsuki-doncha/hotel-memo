<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a8472f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>宿泊メモ</title>
<style>
:root{--main:#1f3a5f;--ai:#6b4fbb;--acc:#c9a24b;--bg:#f6f4ef;--card:#fff;--tx:#222;--sub:#777;--line:#e2ddd2}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:var(--main);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
header h1{flex:1;margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.stay{cursor:pointer}
.stay b{font-size:17px}.sub{color:var(--sub);font-size:13px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;background:#fff}
textarea{min-height:80px;resize:vertical}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;font-size:16px;background:var(--main);color:#fff;margin-top:10px}
.btn.sec{background:#fff;color:var(--main);border:1px solid var(--main)}
.btn.acc{background:var(--acc);color:#222}
.btn.danger{background:#fff;color:#b33;border:1px solid #b33}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
summary{padding:14px 12px;font-weight:bold;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
summary .cnt{font-weight:normal;font-size:13px;color:var(--sub)}
.body{padding:0 12px 12px}
.q{padding:10px 0;border-top:1px dashed var(--line)}
.q .ql{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:14px;font-weight:600}
.aib{flex:none;border:1px solid var(--ai);color:var(--ai);background:#fff;border-radius:16px;padding:4px 10px;font-size:12px}
.q.ai .aib{background:var(--ai);color:#fff}
.q.ai .inp{opacity:.35;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--main);color:#fff;border-color:var(--main)}
.unit{display:flex;align-items:center;gap:6px}.unit span{color:var(--sub)}
.star{color:var(--acc);font-size:11px;margin-left:4px}
pre{white-space:pre-wrap;word-break:break-all;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:.92}
.note{font-size:12px;color:var(--sub);margin-top:4px}
.pe{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fbfaf6}
.pe .ph{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:4px}
.pe .x{border:0;background:none;color:#b33;font-size:14px;padding:4px 8px}
.pe input,.pe textarea{margin:3px 0}
.pe textarea{min-height:56px}
.pe .row{display:flex;gap:6px}.pe .row>*{flex:1}
.pe .ptb{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 10px;font-size:12px;color:var(--sub);margin-top:4px}
.pe .ptb.on{background:var(--ai);border-color:var(--ai);color:#fff}
.padd{width:100%;border:1px dashed var(--main);background:#fff;color:var(--main);border-radius:10px;padding:10px;font-size:15px}

/* ===== 旅ノート風テーマ ===== */
:root{--main:#a8472f;--ai:#6b4fbb;--acc:#e0a526;--bg:#f1e7d0;--card:#fffdf6;--tx:#3b2f2a;--sub:#7d6b5d;--line:#e0d2b4}
[hidden]{display:none!important}
body{background-color:var(--bg);background-image:repeating-linear-gradient(transparent 0 31px,rgba(150,120,70,.13) 31px 32px);background-attachment:local;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Noto Sans JP",system-ui,sans-serif}
header{border-bottom:3px dashed rgba(255,255,255,.55);box-shadow:0 2px 0 var(--main)}
.card,details{border-radius:6px;box-shadow:2px 3px 0 rgba(120,90,50,.15)}
.tape{display:inline-block;background:rgba(224,165,38,.6);padding:3px 14px;transform:rotate(-1.5deg);font-size:15px;margin:16px 0 8px;font-weight:bold;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.qk button{border:2px solid var(--main);background:var(--card);color:var(--main);border-radius:14px;padding:10px 2px;font-size:12px;font-weight:bold;box-shadow:2px 3px 0 var(--main);font-family:inherit}
.qk button b{display:block;font-size:26px;line-height:1.3}
.qk button:active{transform:translate(2px,3px);box-shadow:none}
.lg{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:6px;padding:8px 10px;margin-bottom:6px}
.lg .lk{font-size:20px}.lg .lb{flex:1;white-space:pre-wrap;word-break:break-word;font-size:15px}
.lg .lt{display:inline-block;background:var(--acc);border-radius:10px;padding:0 8px;font-size:12px;margin-right:6px}
.lg .x{border:0;background:none;color:#b33;padding:2px 6px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.gc{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;padding:10px;box-shadow:2px 3px 0 rgba(120,90,50,.15);font-family:inherit;color:var(--tx);font-size:14px}
.gc .ic{font-size:28px;display:block}.gc b{display:block;font-size:14px;margin:2px 0}
.bar{height:8px;background:#eadfc6;border-radius:4px;overflow:hidden;display:flex;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c)}.bar i.a{background:var(--ai)}
.stamp{position:absolute;right:6px;top:6px;border:2px solid #c0392b;color:#c0392b;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;transform:rotate(-14deg);opacity:.85}
.srch{margin:6px 0}
.sch{margin:8px 0 4px}
.lh{font-size:13px;font-weight:bold;margin:12px 0 2px;color:var(--main)}
#sheet{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:20;display:flex;align-items:flex-end}
.sh{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sh textarea{min-height:100px;margin-bottom:6px}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.btn{box-shadow:2px 3px 0 rgba(0,0,0,.2)}
.btn.sec{background:var(--card)}
.btn.acc{color:#3b2f2a}
.empty{color:var(--sub);font-size:13px;padding:8px 0}
</style>
</head>
<body>
<header><button id="hb" style="display:none">←</button><h1 id="ht">宿泊メモ</h1><button id="ha" style="display:none"></button></header>
<main id="app"></main>
<div id="sheet" hidden></div>
<div class="toast" id="toast"></div>
<script>
// ===== 質問カテゴリ (ここを編集すればカスタマイズできます) =====
// t:1行 l:長文 n:数値(u=単位) c:単一選択+自由入力 m:複数選択  f:1 = AIが調べやすい事実項目
const CATS=[
{id:'book',name:'予約・アップグレード',icon:'📝',q:[
 {id:'route',l:'予約経路・料金プラン',t:'c',o:['公式','Bonvoy会員料金','Bonvoy Bootcamp','OTA','ポイント宿泊','特典宿泊']},
 {id:'status',l:'会員ステータス',t:'c',o:['ブロンズ','シルバー','ゴールド','プラチナ','チタン','アンバサダー','非会員']},
 {id:'upg',l:'アップグレードの有無と内容(予約→実際)',t:'l'},
 {id:'gift',l:'ウェルカムギフト・アメニティ特典',t:'l'},
 {id:'eci',l:'アーリーチェックインは可能だった?',t:'c',o:['できた','一部可','できなかった','頼まなかった']},
 {id:'eci_t',l:'実際に入れた時刻',t:'t'},
 {id:'lco_g',l:'レイトチェックアウトの保証時刻(規定)',t:'t',f:1},
 {id:'lco_a',l:'実際のチェックアウト時刻・交渉結果',t:'t'},
 {id:'bf_perk',l:'会員特典の朝食・ラウンジ利用条件',t:'l',f:1}]},
{id:'acc',name:'アクセス・到着',icon:'🚉',q:[
 {id:'sta',l:'最寄り駅・空港からの行き方',t:'l',f:1},
 {id:'park',l:'駐車場の料金・条件',t:'t',f:1},
 {id:'cit',l:'チェックイン方法・場所',t:'c',o:['フロント','ロビーラウンジ','ラウンジ','スマホ/自動']},
 {id:'wait',l:'チェックイン待ち時間',t:'n',u:'分'},
 {id:'wd',l:'ウェルカムドリンク/おもてなし',t:'t'},
 {id:'lobby',l:'ロビー・外観の印象',t:'l'}]},
{id:'room',name:'客室',icon:'🛏️',q:[
 {id:'floor',l:'階数',t:'n',u:'階'},
 {id:'size',l:'広さ(公式)',t:'n',u:'㎡',f:1},
 {id:'bed',l:'ベッドの種類・サイズ',t:'t',f:1},
 {id:'view',l:'眺望',t:'m',o:['海','山','街','川','公園','中庭','壁','空']},
 {id:'view_n',l:'眺望の具体メモ',t:'l'},
 {id:'sound',l:'防音・騒音',t:'c',o:['静か','少し気になる','うるさい']},
 {id:'usb',l:'コンセント・USB・充電環境',t:'t'},
 {id:'desk',l:'デスク・作業環境/Wi-Fi',t:'t'},
 {id:'closet',l:'クローゼット・収納',t:'t'},
 {id:'tv',l:'TV・設備(ネスプレッソ等)',t:'t',f:1}]},
{id:'bath',name:'バス・アメニティ',icon:'🛁',q:[
 {id:'tub',l:'バスタブ・シャワー',t:'c',o:['独立シャワー有','バスタブのみ','洗い場付き','雨降りシャワー']},
 {id:'sink',l:'洗面台(ダブル/シングル)',t:'t'},
 {id:'press',l:'水圧・お湯の出',t:'c',o:['良い','普通','弱い']},
 {id:'toilet',l:'トイレ設備',t:'m',o:['ウォシュレット','独立','ドア付き','段差']},
 {id:'amen',l:'アメニティブランド',t:'t',f:1},
 {id:'skin',l:'スキンケア類の有無',t:'t'},
 {id:'skin_b',l:'スキンケア・ボディ用品のブランド',t:'t',f:1},
 {id:'dry',l:'ドライヤー',t:'t'},
 {id:'pj',l:'パジャマ・部屋着',t:'t'},
 {id:'slip',l:'スリッパ',t:'t'},
 {id:'toothb',l:'歯ブラシ等',t:'t'}]},
{id:'mini',name:'ミニバー・ドリンク',icon:'🥤',q:[
 {id:'water',l:'水(無料/有料・本数)',t:'t'},
 {id:'coffee',l:'コーヒー・お茶',t:'t'},
 {id:'fridge',l:'冷蔵庫の中身',t:'t'},
 {id:'sweets',l:'お菓子・スナック',t:'t'},
 {id:'td_t',l:'ターンダウンの有無',t:'c',o:['あり','なし','要望制']},
 {id:'td_q',l:'ターンダウンの内容',t:'l'},
 {id:'bought',l:'部屋で楽しんだもの(購入品・ホテル内で買ったもの)',t:'l'},
 {id:'stylei',l:'お部屋での過ごし方・そのホテルらしい楽しみ方',t:'l'}]},
{id:'bf',name:'朝食',icon:'🍳',q:[
 {id:'bf_place',l:'会場',t:'t'},
 {id:'bf_time',l:'営業時間',t:'t',f:1},
 {id:'bf_price',l:'料金',t:'n',u:'円',f:1},
 {id:'bf_style',l:'形式',t:'c',o:['ブッフェ','セット','アラカルト','ルームサービス']},
 {id:'bf_visit',l:'訪問時刻',t:'t'},
 {id:'bf_cong',l:'混雑・待ち時間',t:'t'},
 {id:'bf_seat',l:'席・雰囲気',t:'t'},
 {id:'bf_best',l:'一番美味しかったもの',t:'l'},
 {id:'bf_bad',l:'残念だった点',t:'l'},
 {id:'bf_local',l:'ご当地メニュー',t:'t'}]},
{id:'eat',name:'ホテル外の食事・買い物',icon:'🍽️',q:[
 {id:'eats',l:'訪れた飲食店(ランチ・夕食・朝食調達など複数)',t:'p',k:'food'},
 {id:'shops',l:'立ち寄った買い物先・道の駅・お土産(複数)',t:'p',k:'spot'},
 {id:'eat_p',l:'予定と実際のズレ・予約のコツ(満席など)',t:'l'}]},
{id:'dine',name:'ラウンジ・レストラン',icon:'🍸',q:[
 {id:'lg',l:'ラウンジの利用有無',t:'c',o:['利用した','対象外','混雑で断念']},
 {id:'lg_time',l:'ラウンジ営業時間・タイムテーブル',t:'l',f:1},
 {id:'lg_food',l:'ラウンジの料理・ドリンク',t:'l'},
 {id:'lg_cong',l:'ラウンジの混雑状況',t:'t'},
 {id:'din_n',l:'レストラン・ディナーの感想',t:'l'},
 {id:'din_dress',l:'ドレスコード',t:'t',f:1},
 {id:'din_price',l:'ディナー価格(目安)',t:'n',u:'円',f:1},
 {id:'din_rsv',l:'予約の要否',t:'t',f:1},
 {id:'din_m',l:'印象に残った一品',t:'l'}]},
{id:'well',name:'施設・ウェルネス',icon:'🏊',q:[
 {id:'pool',l:'プール・大浴場・スパ営業時間',t:'t',f:1},
 {id:'pool_rsv',l:'予約制?',t:'t'},
 {id:'pool_ng',l:'利用制限',t:'m',o:['タトゥーNG','年齢制限','水着必須','宿泊者のみ']},
 {id:'pool_t',l:'水温',t:'n',u:'℃'},
 {id:'pool_c',l:'混雑度',t:'c',o:['貸切','空いてた','普通','混んでた']},
 {id:'gym',l:'ジム設備',t:'m',o:['マシン','フリーウェイト','ヨガ','24h','無料']},
 {id:'sauna',l:'サウナ・水風呂',t:'t'},
 {id:'well_n',l:'その他施設メモ',t:'l'}]},
{id:'near',name:'周辺・立地',icon:'🗺️',q:[
 {id:'n_shop',l:'近くのコンビニ・スーパー',t:'t'},
 {id:'spots',l:'訪れた観光地・スポット(複数)',t:'p',k:'spot'},
 {id:'n_spot',l:'周辺の観光スポット(公式情報など・AI補足向け)',t:'l',f:1},
 {id:'n_gift',l:'ホテル内ショップ・お土産',t:'t'},
 {id:'n_noise',l:'周辺の騒音・治安',t:'t'}]},
{id:'sum',name:'総評',icon:'⭐',q:[
 {id:'good',l:'良かった点 ベスト3',t:'l'},
 {id:'bad',l:'惜しかった点',t:'l'},
 {id:'who',l:'おすすめの人',t:'t'},
 {id:'repeat',l:'リピートしたい?',t:'c',o:['ぜひ','機会があれば','微妙','もう泊まらない']},
 {id:'bring',l:'持っていくと良いもの',t:'t'}]}
];
// ===== state =====
const KEY='hotelmemo.v1';
let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||!Array.isArray(D.stays))D={stays:[]};
let view='list',cur=null,opened={},curCat=null,scene=-1,sheet=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('保存に失敗しました')}},200)}
function flush(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
const S=()=>D.stays.find(s=>s.id===cur);
function ans(s,q){return s.a[q]||(s.a[q]={v:'',ai:false})}
function nonEmpty(v){if(Array.isArray(v)){if(v.length&&typeof v[0]==='object')return v.some(e=>peOk(e));return v.length>0}return String(v==null?'':v).trim()!==''}
function peOk(e){return e&&((e.n||'').trim()||(e.m||'').trim()||(e.w||'').trim())}
const FT=['ランチ','ディナー','朝食','カフェ・軽食','テイクアウト','その他'],RC=['◎おすすめ','○良い','△微妙'];
const WL={food:'注文したもの',spot:'体験したこと/購入したもの'};
function peLines(q,v){const out=[];v.filter(peOk).forEach((e,i)=>{
 const head=[e.tp,e.n||'(名称未入力)'].filter(Boolean);let t=e.t?e.t:(e.ph?'':'');
 out.push(`  ${i+1}. **${head.join(' / ')}**`+(e.r?`(${e.r})`:''));
 if(e.t||e.ph)out.push(`     - 訪問時刻: ${e.t||''}${e.ph?(e.t?' ':'')+'【写真の撮影時刻から確認してほしい】':''}`);
 if(e.w)out.push(`     - ${WL[q.k]}: ${e.w.replace(/\n/g,' ')}`);
 if(e.m)out.push(`     - 感想: ${e.m.replace(/\n/g,' ')}`);
 if(e.tip)out.push(`     - 注意・Tips: ${e.tip.replace(/\n/g,' ')}`)});return out}
function filled(a){return a&&!a.ai&&nonEmpty(a.v)}
function fmt(q,a){const v=a.v;if(q.t==='p')return '';let s=Array.isArray(v)?v.join('、'):String(v).trim();if(q.t==='n'&&q.u)s+=q.u;return s}
// ===== views =====
function setHead(t,back,act){$('#ht').textContent=t;const b=$('#hb'),a=$('#ha');b.style.display=back?'':'none';b.onclick=back||null;a.style.display=act?'':'none';if(act){a.textContent=act[0];a.onclick=act[1]}}
function render(){
 window.scrollTo(0,0);
 if(view==='list')rList();else if(view==='new')rNew();else if(view==='stay')rStay();else if(view==='cat')rCat();else rExport();
}
function goto(v,id){view=v;if(id)cur=id;render()}
function rList(){
 setHead('宿泊メモ',null,['＋新規',()=>goto('new')]);
 const h=D.stays.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id).map(s=>{
  let n=0,ai=0,tot=0;CATS.forEach(c=>c.q.forEach(q=>{tot++;const a=s.a[q.id];if(filled(a))n++;else if(a&&a.ai)ai++}));
  return `<div class="card stay" data-open="${s.id}"><b>${esc(s.hotel)}</b><div class="sub">${esc(s.date||'日付未設定')} ・ ${esc(s.room||s.booked||'部屋未入力')}</div><div class="sub">記入 ${n}/${tot} ・ 🤖AI依頼 ${ai}</div></div>`}).join('');
 $('#app').innerHTML=(h||'<div class="card sub">📓 まだ宿泊記録がありません。右上の「＋新規」から旅を始めましょう。</div>')+
 '<div class="note">データはこの端末のブラウザ内にのみ保存されます。大事な記録は「書き出し」でバックアップしてください。</div>';
}
function rNew(){
 setHead('新しい宿泊',()=>goto('list'));
 const today=new Date();today.setMinutes(today.getMinutes()-today.getTimezoneOffset());
 $('#app').innerHTML=`<div class="card">
 <label>ホテル名(必須)</label><input type="text" id="nh" placeholder="例:○○マリオット ホテル">
 <label>予約した部屋タイプ</label><input type="text" id="nb" placeholder="例:デラックスツイン">
 <div class="note">部屋タイプの候補は、記事作成時にClaude Codeへ調べてもらう想定です(下のAI依頼で対応)。</div>
 <label>宿泊日</label><input type="date" id="nd" value="${today.toISOString().slice(0,10)}">
 <button class="btn" id="ncreate">記録を始める</button></div>`;
 $('#ncreate').onclick=()=>{

function qHTML(s,q){
 const a=ans(s,q.id),v=a.v;let inp='';
 if(q.t==='t')inp=`<input type="text" data-q="${q.id}" value="${esc(v)}">`;
 else if(q.t==='l')inp=`<textarea data-q="${q.id}">${esc(v)}</textarea>`;
 else if(q.t==='n')inp=`<div class="unit"><input type="number" inputmode="decimal" data-q="${q.id}" value="${esc(v)}"><span>${esc(q.u||'')}</span></div>`;
 else if(q.t==='c')inp=`<div class="chips">${q.o.map(o=>`<button type="button" class="chip${v===o?' on':''}" data-chip="${q.id}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div><input type="text" data-q="${q.id}" placeholder="自由入力" value="${esc(v)}">`;
 else if(q.t==='p'){const arr=Array.isArray(v)?v:[];inp=arr.map((e,i)=>peHTML(q,e,i)).join('')+`<button type="button" class="padd" data-padd="${q.id}">＋ ${q.k==='food'?'お店':'場所'}を追加</button>`}
 else if(q.t==='m'){const arr=Array.isArray(v)?v:[];inp=`<div class="chips">${q.o.map(o=>`<button type="button" class="chip${arr.includes(o)?' on':''}" data-mchip="${q.id}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}
 return `<div class="q${a.ai?' ai':''}" id="q-${q.id}"><div class="ql"><span>${esc(q.l)}${q.f?'<span class="star">★事実</span>':''}</span><button type="button" class="aib" data-ai="${q.id}">🤖 AIに任せる</button></div><div class="inp">${inp}</div></div>`;
}
function peHTML(q,e,i){const id=q.id;
 const chips=(arr,f)=>`<div class="chips">${arr.map(o=>`<button type="button" class="chip${e[f]===o?' on':''}" data-pchip="${id}" data-i="${i}" data-f="${f}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
 const fi=(f,ph,tag)=>tag==='ta'?`<textarea data-pf="${id}" data-i="${i}" data-f="${f}" placeholder="${ph}">${esc(e[f])}</textarea>`:`<input type="text" data-pf="${id}" data-i="${i}" data-f="${f}" placeholder="${ph}" value="${esc(e[f])}">`;
 return `<div class="pe"><div class="ph"><span>${i+1}件目</span><button type="button" class="x" data-pdel="${id}" data-i="${i}">✕ 削除</button></div>
 ${q.k==='food'?chips(FT,'tp'):''}
 ${fi('n',q.k==='food'?'店名':'場所の名前')}
 <div class="row">${fi('t','訪問時刻(例 12:30頃)')}<button type="button" class="ptb${e.ph?' on':''}" data-ptime="${id}" data-i="${i}">🕒 時刻は写真から確認して</button></div>
 ${fi('w',WL[q.k]+'(例:'+(q.k==='food'?'生姜焼き定食・ブリのお造り':'ソフトクリーム')+')','ta')}
 ${fi('m','感想・見どころ','ta')}
 ${fi('tip','注意・Tips(現金のみ/予約要/混雑 など)','ta')}
 ${chips(RC,'r')}</div>`}
function cnt(s,c){let n=0,ai=0;c.q.forEach(q=>{const a=s.a[q.id];if(filled(a))n++;else if(a&&a.ai)ai++});return `${n}/${c.q.length}${ai?' ・🤖'+ai:''}`}
const CC={book:'#e07a5f',acc:'#3d85a8',room:'#81a35b',bath:'#5b9bd5',mini:'#d98cb3',bf:'#e0a526',eat:'#cf6a3d',dine:'#8e5ea2',well:'#2fa39a',near:'#7aa05a',sum:'#c9a24b'};
const KINDS=[['m','✏️','一言'],['f','🍽️','食事'],['p','📍','場所'],['i','💡','気づき']];
const SC=[['🏨','チェックイン',['book','acc']],['🛏️','お部屋',['room','bath','mini']],['🍳','朝食',['bf']],['🍸','ラウンジ・夕食',['dine','eat']],['🏊','施設',['well']],['🗺️','観光・周辺',['near','eat']],['⭐','総評',['sum']]];
function prog(s,c){let n=0,ai=0;c.q.forEach(q=>{const a=s.a[q.id];if(filled(a))n++;else if(a&&a.ai)ai++});return {n,ai,t:c.q.length}}
function barH(p){return `<i style="width:${p.n/p.t*100}%"></i><i class="a" style="width:${p.ai/p.t*100}%"></i>`}
function gridHTML(s){const sc=scene>=0?SC[scene][2]:null;return CATS.filter(c=>!sc||sc.includes(c.id)).map(c=>{const p=prog(s,c);return `<button type="button" class="gc" style="--c:${CC[c.id]||'#c9a24b'}" data-gcat="${c.id}">${p.n+p.ai===p.t?'<span class="stamp">済</span>':''}<span class="ic">${c.icon}</span><b>${esc(c.name)}</b><span class="sub" id="cnt-${c.id}">${cnt(s,c)}</span><div class="bar" id="bar-${c.id}">${barH(p)}</div></button>`}).join('')}
function scenesHTML(){return `<button type="button" class="chip${scene<0?' on':''}" data-scene="-1">すべて</button>`+SC.map((x,i)=>`<button type="button" class="chip${scene===i?' on':''}" data-scene="${i}">${x[0]} ${esc(x[1])}</button>`).join('')}
function logHTML(s){const L=(s.log||[]).slice().reverse();if(!L.length)return '<div class="empty">まだログがありません。上のボタンで、思いついたことをすぐ残せます。</div>';
 return L.map(e=>{const k=KINDS.find(x=>x[0]===e.k)||KINDS[0];return `<div class="lg" data-ledit="${e.id}"><span class="lk">${k[1]}</span><div class="lb">${e.t?`<span class="lt">${esc(e.t)}</span>`:''}${esc(e.x)}</div><button type="button" class="x" data-ldel="${e.id}">✕</button></div>`}).join('')}
function rStay(){
 const s=S();setHead(s.hotel,()=>goto('list'),['書き出し',()=>goto('export')]);
 $('#app').innerHTML=`<details><summary><span>🏨 宿泊情報</span><span class="cnt">タップで編集</span></summary><div class="body">
 <label>ホテル名</label><input type="text" data-meta="hotel" value="${esc(s.hotel)}">
 <label>予約した部屋</label><input type="text" data-meta="booked" value="${esc(s.booked)}">

 $('#gexp').onclick=()=>goto('export');
 $('#gdel').onclick=()=>{if(confirm('この宿泊記録を削除しますか?(元に戻せません)')){D.stays=D.stays.filter(x=>x.id!==cur);save();goto('list')}};

function rCat(){

 $('#app').innerHTML=`<div class="card" style="--c:${CC[c.id]||'#c9a24b'}"><span class="sub" id="cnt-${c.id}">${cnt(s,c)}</span><div class="bar" id="bar-${c.id}">${barH(prog(s,c))}</div></div><div class="card">${c.q.map(q=>qHTML(s,q)).join('')}<button class="btn sec" data-allai="${c.id}">🤖 未記入をすべてAIに任せる</button></div>`;

function doSearch(v){
 const s=S(),q=v.trim().toLowerCase(),res=$('#sres'),g=$('#grid');
 if(!q){res.hidden=true;g.hidden=false;$('#scenes').hidden=false;return}
 $('#scenes').hidden=true;g.hidden=true;res.hidden=false;

 res.innerHTML=out||'<div class="empty">該当する項目がありません。</div>';

function closeSheet(){sheet=null;$('#sheet').hidden=true;$('#sheet').innerHTML=''}
function openSheet(k,id){
 const s=S(),e=id?(s.log||[]).find(x=>x.id===id):null;sheet={id:id||null,k:e?e.k:k};
 const sh=$('#sheet');sh.hidden=false;
 sh.innerHTML=`<div class="sh"><div class="chips">${KINDS.map(([c,ic,n])=>`<button type="button" class="chip${c===sheet.k?' on':''}" data-lk="${c}">${ic} ${n}</button>`).join('')}</div><textarea id="lx" placeholder="思いついたことを一言… (キーボードのマイクで音声入力もできます)">${esc(e?e.x:'')}</textarea><input type="text" id="lt" placeholder="時刻(任意) 例:12:30頃" value="${esc(e?e.t:'')}"><div class="row2"><button type="button" class="btn sec" id="lc">キャンセル</button><button type="button" class="btn" id="ls">保存</button></div></div>`;
 $('#lc').onclick=closeSheet;
 $('#ls').onclick=()=>{

  save();closeSheet();const l=$('#loglist');if(l)l.innerHTML=logHTML(s);toast('ログに追加しました 📓');
 };
 setTimeout(()=>{const x=$('#lx');if(x)x.focus()},60);
}
function refreshQ(q){const s=S();const el=$('#q-'+q.id);if(el){el.outerHTML=qHTML(s,q)}updCount()}
function updCount(){const s=S();CATS.forEach(c=>{const e=$('#cnt-'+c.id);if(e)e.textContent=cnt(s,c);const b=$('#bar-'+c.id);if(b)b.innerHTML=barH(prog(s,c))})}
const QM={};CATS.forEach(c=>c.q.forEach(q=>QM[q.id]=q));
// ===== events =====
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-open],[data-chip],[data-mchip],[data-ai],[data-allai],[data-padd],[data-pdel],[data-pchip],[data-ptime],[data-quick],[data-lk],[data-ledit],[data-ldel],[data-gcat],[data-scene]');if(!t)return;
 if(t.dataset.open){cur=+t.dataset.open;opened={};goto('stay');return}
 const s=S();if(!s)return;
 if(t.dataset.quick){openSheet(t.dataset.quick);return}
 if(t.dataset.lk){sheet.k=t.dataset.lk;document.querySelectorAll('[data-lk]').forEach(b=>b.classList.toggle('on',b.dataset.lk===sheet.k));return}
 if(t.dataset.ldel){if(confirm('このログを削除しますか?')){s.log=(s.log||[]).filter(x=>x.id!==+t.dataset.ldel);save();$('#loglist').innerHTML=logHTML(s)}return}
 if(t.dataset.ledit){openSheet(null,+t.dataset.ledit);return}
 if(t.dataset.gcat){curCat=t.dataset.gcat;goto('cat');return}
 if(t.dataset.scene){scene=+t.dataset.scene;$('#scenes').innerHTML=scenesHTML();$('#grid').innerHTML=gridHTML(s);return}
 if(t.dataset.chip){const q=QM[t.dataset.chip],a=ans(s,q.id);a.v=a.v===t.dataset.val?'':t.dataset.val;a.ai=false;save();refreshQ(q)}
 else if(t.dataset.mchip){const q=QM[t.dataset.mchip],a=ans(s,q.id);const arr=Array.isArray(a.v)?a.v:[];const i=arr.indexOf(t.dataset.val);i>=0?arr.splice(i,1):arr.push(t.dataset.val);a.v=arr;a.ai=false;save();refreshQ(q)}
 else if(t.dataset.padd){const q=QM[t.dataset.padd],a=ans(s,q.id);if(!Array.isArray(a.v))a.v=[];a.v.push({n:'',t:'',w:'',m:'',tip:'',tp:'',r:'',ph:false});a.ai=false;save();refreshQ(q);const ns=document.querySelectorAll('#q-'+q.id+' .pe');const last=ns[ns.length-1];if(last){const f=last.querySelector('input[data-f=n]');if(f)f.focus()}}
 else if(t.dataset.pdel){const q=QM[t.dataset.pdel],a=ans(s,q.id);if(confirm('この項目を削除しますか?')){a.v.splice(+t.dataset.i,1);save();refreshQ(q)}}
 else if(t.dataset.pchip){const q=QM[t.dataset.pchip],a=ans(s,q.id),e=a.v[+t.dataset.i],f=t.dataset.f;e[f]=e[f]===t.dataset.val?'':t.dataset.val;a.ai=false;save();refreshQ(q)}
 else if(t.dataset.ptime){const q=QM[t.dataset.ptime],a=ans(s,q.id),e=a.v[+t.dataset.i];e.ph=!e.ph;save();refreshQ(q)}
 else if(t.dataset.ai){const q=QM[t.dataset.ai],a=ans(s,q.id);a.ai=!a.ai;save();refreshQ(q)}
 else if(t.dataset.allai){const c=CATS.find(x=>x.id===t.dataset.allai);c.q.forEach(q=>{const a=ans(s,q.id);if(!nonEmpty(a.v))a.ai=true;});save();c.q.forEach(q=>refreshQ(q));toast('未記入をAI依頼にしました')}
});

 if(t.dataset.q){const a=ans(s,t.dataset.q);a.v=t.value;if(a.ai&&nonEmpty(t.value)){a.ai=false;const el=$('#q-'+t.dataset.q);if(el)el.classList.remove('ai');}save();updCount()}

function toMD(s){
 const L=[];const hotel=s.hotel||'(ホテル名未入力)';
 L.push(`# ${hotel} 宿泊メモ`,'');
 L.push(`- 宿泊日: ${s.date||'未入力'}`);
 L.push(`- 予約した部屋: ${s.booked||'未入力'}`);
 L.push(`- 実際の部屋: ${s.room||'(予約と同じ/未入力)'}`,'');
 if((s.log||[]).length){L.push('## 旅のログ(現地での一言メモ・入力順)','');s.log.forEach(e=>{const k=KINDS.find(x=>x[0]===e.k);L.push(`- ${e.t?'['+e.t+'] ':''}${k?k[1]+k[2]+': ':''}${e.x.replace(/\n/g,' / ')}`)});L.push('')}
 L.push('## 現地メモ(一次情報・本人が確認)','');
 let any=false;
 CATS.forEach(c=>{const rows=c.q.filter(q=>filled(s.a[q.id]));if(!rows.length)return;any=true;
  L.push(`### ${c.icon} ${c.name}`);
  rows.forEach(q=>{const a=s.a[q.id];if(q.t==='p'){L.push(`- ${q.l}:`);peLines(q,a.v).forEach(x=>L.push(x));return}const t=fmt(q,a).replace(/\n/g,'\n  ');L.push(`- ${q.l}: ${t}`)});L.push('')});
 if(!any)L.push('(記入なし)','');
 L.push('## AI調査依頼','');
 L.push('以下は現地で確認できなかった/調べてほしい項目です。','');
 let ai=false;
 CATS.forEach(c=>{const rows=c.q.filter(q=>{const a=s.a[q.id];return a&&a.ai});if(!rows.length)return;ai=true;
  L.push(`### ${c.icon} ${c.name}`);rows.forEach(q=>L.push(`- [ ] ${q.l}`));L.push('')});
 if(!ai)L.push('(依頼なし)','');
 L.push('---','','## 記事作成時のClaude Codeへの指示','');
 L.push('- 「現地メモ」は筆者本人が現地で確認した一次情報として最優先で扱うこと。');
 L.push('- 「AI調査依頼」の各項目は、公式サイト等をWeb検索して調べること。');
 L.push('- 調べた内容は「AI補足」と明記し、出典URLと確認日を添えること。');
 L.push('- 情報は「〇年〇月時点」と時点を明記し、確認できなかった項目は「未確認」とすること。');
 L.push('- 現地メモとWeb情報が食い違う場合は現地メモを優先し、食い違いを注記すること。');
 L.push('- 訪問時刻が「写真の撮影時刻から確認してほしい」の項目は、筆者が渡す写真のEXIF撮影時刻から時刻を補完すること。');
 L.push('- 「旅のログ」は現地で書いた一言メモ。時刻は任意入力のため、無いものは入力順を時系列の目安にすること。');
 L.push('- 訪れた場所・飲食店は複数あるため、記事では時系列に並べ、各店の「注意・Tips」は読者向け情報として目立たせること。','');
 return L.join('\n');
}
function fname(s){return (s.hotel||'hotel').replace(/[\\/:*?"<>|\s]+/g,'_')+'_'+(s.date||'')+'.md'}
function rExport(){
 const s=S();setHead('書き出し',()=>goto('stay'));
 const md=toMD(s);
 $('#app').innerHTML=`<button class="btn" id="xs">📤 共有(Quick Share / AirDrop)</button><button class="btn sec" id="xc">📋 コピー</button><button class="btn sec" id="xd">⬇ .mdファイルを保存</button><div class="note">共有ボタンで近くのデバイスやアプリへ送れます。</div><pre id="xp">${esc(md)}</pre>`;
 $('#xc').onclick=async()=>{try{await navigator.clipboard.writeText(md);toast('コピーしました')}catch(e){toast('コピーに失敗しました')}};
 const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download=fname(s);document.body.appendChild(a);a.click();a.remove();toast('保存しました')};
 $('#xd').onclick=dl;
 $('#xs').onclick=async()=>{
  try{
   const f=new File([md],fname(s),{type:'text/plain'});
   if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:s.hotel+' 宿泊メモ'});
   else if(navigator.share)await navigator.share({title:s.hotel+' 宿泊メモ',text:md});
   else dl();
  }catch(e){if(e.name!=='AbortError')dl()}
 };
}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
